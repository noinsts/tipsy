services:
  db:
    image: postgres:15-alpine
    container_name: tipsy_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: tipsy_backend
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    env_file:
      - .env
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_BOT_INTERNAL_TOKEN: ${BOT_INTERNAL_TOKEN}
      UPLOAD_DIR: ${UPLOAD_DIR}
      VITE_API_URL: ${VITE_API_URL}
    volumes:
      - upload_data:${UPLOAD_DIR}
    depends_on:
      - db

  employee_bot:
    build: ./employee_bot
    container_name: tipsy_employee_bot
    restart: always
    env_file:
      - .env
    environment:
      TELEGRAM_EMPLOYEE_BOT_TOKEN: ${TELEGRAM_EMPLOYEE_BOT_TOKEN}
      BACKEND_URL: ${BACKEND_URL}
      BOT_INTERNAL_TOKEN: ${BOT_INTERNAL_TOKEN}
    depends_on:
      backend:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  master_bot:
    build: ./master_bot
    container_name: tipsy_master_bot
    restart: always
    env_file:
      - .env
    environment:
      TELEGRAM_MASTER_BOT_TOKEN: ${TELEGRAM_MASTER_BOT_TOKEN}
      BACKEND_URL: ${BACKEND_URL}
      BOT_INTERNAL_TOKEN: ${BOT_INTERNAL_TOKEN}
    depends_on:
      backend:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    container_name: tipsy_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      VITE_API_URL: ${VITE_API_URL}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  upload_data: